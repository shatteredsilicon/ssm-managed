syntax = "proto3";

package api;

option go_package = ".;api";
import "google/api/annotations.proto";

message MetricSample {
	string metric = 1;
	double value = 2;
}

message GetAdvisedMetricSamplesRequest {
  string instance = 1;
}

message GetAdvisedMetricSamplesResponse {
  repeated MetricSample samples = 1;
}

service Metric {
  rpc GetAdvisedMetricSamples(GetAdvisedMetricSamplesRequest) returns (GetAdvisedMetricSamplesResponse) {
      option (google.api.http) = {
          get: "/v0/metric/advised-metric-samples"
      };
  }
}