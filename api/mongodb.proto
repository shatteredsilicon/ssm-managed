syntax = "proto3";

package api;

option go_package = ".;api";
import "google/api/annotations.proto";

message MongoDBAddRequest {
    string name = 1;
    string address = 2;
}

message MongoDBAddResponse {
    int32 id = 1;
}

service MongoDB {
    rpc Add(MongoDBAddRequest) returns (MongoDBAddResponse) {
        option (google.api.http) = {
            post: "/v0/mongodb"
            body: "*"
        };
    }
}
